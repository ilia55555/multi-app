[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[[redirects]]
  from = "/api/apps"
  to = "/.netlify/functions/apps"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload-app"
  status = 200

[[redirects]]
  from = "/community-apps/*"
  to = "/.netlify/functions/serve-app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
