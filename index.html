<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="مرکز دسترسی سریع به اپلیکیشن‌های شخصی">
  <link rel="manifest" id="app-manifest">
  <link rel="stylesheet" href="./styles.css">
  <title>جعبه ابزار من</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="صفحه اصلی جعبه ابزار">
      <span class="brand-icon">M</span>
      <span class="brand-copy"><b>جعبه ابزار من</b><small>MY DIGITAL WORKSPACE</small></span>
    </a>
    <label class="search" for="search">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="جستجو بین ابزارها..." autocomplete="off">
      <kbd>Ctrl K</kbd>
    </label>
    <button id="installButton" class="install-button" hidden type="button"><span>⇩</span> نصب</button>
  </header>

  <main class="shell">
    <section class="intro">
      <div>
        <span class="eyebrow"><i></i> ابزارهای آماده</span>
        <h1>سریع وارد اپ موردنظرت شو.</h1>
        <p>کارت‌ها به‌صورت خودکار از فایل apps.json ساخته می‌شوند.</p>
      </div>
      <div class="tool-count"><strong id="toolCount">۰</strong><span>اپ فعال</span></div>
    </section>

    <section class="apps-section" aria-labelledby="appsTitle">
      <div class="section-head">
        <div><span>مجموعه من</span><h2 id="appsTitle">اپلیکیشن‌ها</h2></div>
        <p id="resultCount" aria-live="polite">در حال بارگذاری…</p>
      </div>

      <div class="apps" id="appsGrid" aria-live="polite"></div>

      <div class="empty-results" id="emptyResults" hidden>
        <span>⌕</span><h3>ابزاری پیدا نشد</h3><p>عبارت دیگری را جستجو کن.</p>
      </div>

      <div class="load-error" id="loadError" hidden role="alert">
        <strong>فهرست اپ‌ها بارگذاری نشد.</strong>
        <span>ساختار فایل apps.json را بررسی کن.</span>
      </div>
    </section>
  </main>

  <script src="./app.js" type="module"></script>
</body>
</html>
